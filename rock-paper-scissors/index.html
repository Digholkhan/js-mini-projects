<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="card">
        <h1>Rock Paper Scissors</h1>
        <p>Choose one:</p>
        <div class="choices"><button data-choice="rock">Rock</button><button data-choice="paper">Paper</button><button
                data-choice="scissors">Scissors</button></div>
        <p id="result">Your score: 0 | Computer score: 0</p>
    </main>
    <script src="script.js"></script>
</body>

</html>

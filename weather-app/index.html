<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="card">
        <h1>Weather App</h1>
        <form id="form"><input id="city" placeholder="Enter a city" required><button>Search</button></form>
        <p id="status">Search for a city to see its weather.</p>
        <section id="weather" hidden>
            <h2 id="place"></h2>
            <p id="temperature"></p>
            <p id="wind"></p>
        </section>
    </main>
    <script src="script.js"></script>
</body>

</html>
